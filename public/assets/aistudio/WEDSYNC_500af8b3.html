);position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero-img img{width:100%;height:100%;object-fit:cover;opacity:.86}.hero-note{position:absolute;bottom:20px;left:20px;background:#fffdf5eF;padding:15px 18px;border-radius:13px;max-width:230px}.hero-note b{font-family:'Playfair Display';font-size:18px;color:var(--burgundy)}.section{padding:55px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:25px}.section h2,.page-title{font:600 32px 'Playfair Display',serif;color:#4b2532;margin:7px 0}.section-head p{margin:0;color:var(--muted)}.grid{display:grid;gap:18px}.categories{grid-template-columns:repeat(5,1fr)}.category{background:white;border:1px solid var(--line);border-radius:16px;padding:22px 12px;text-align:center;transition:.2s}.category:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.cat-icon{width:48px;height:48px;border-radius:15px;background:var(--rose-light);display:grid;place-items:center;font-size:23px;margin:0 auto 12px}.vendor-grid{grid-template-columns:repeat(3,1fr)}.vendor-card{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 4px 15px #50333a08}.vendor-card img{width:100%;height:190px;object-fit:cover;background:#eadbd5}.vendor-body{padding:16px}.vendor-body h3{margin:6px 0;font:600 20px 'Playfair Display';color:var(--burgundy)}.tag{display:inline-block;padding:5px 9px;border-radius:30px;background:#f6eeea;color:#85515a;font-size:11px;font-weight:700}.price{font-weight:700;color:var(--burgundy);font-size:16px}.vendor-foot{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:30px}.stat{padding:22px;background:#fff;border:1px solid var(--line);border-radius:15px}.stat strong{display:block;font:600 28px 'Playfair Display';color:var(--burgundy)}.footer{padding:35px 0;background:#4b2532;color:#f8eeeb;margin-top:45px}.footer .logo{color:white}.footer p{color:#d8c4c5}.page{padding:35px 0 65px;min-height:70vh}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px;flex:1;min-width:0}.field label{font-size:12px;font-weight:700;color:#68575b}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;border:1px solid #e5d9d3;background:white;border-radius:9px;padding:11px 12px;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus{border-color:var(--rose)}.toolbar input{max-width:300px}.toolbar select{width:auto;min-width:150px}.dashboard{display:grid;grid-template-columns:235px 1fr;gap:25px}.sidebar{background:white;border:1px solid var(--line);border-radius:17px;padding:18px;height:max-content;position:sticky;top:90px}.side-label{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#a18e8c;font-weight:700;margin:12px 8px}.side-link{display:flex;gap:10px;align-items:center;padding:11px 10px;border-radius:9px;color:#6f6063;margin:3px 0}.side-link:hover,.side-link.active{background:var(--rose-light);color:var(--burgundy);font-weight:700}.dash-content{min-width:0}.cards-4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:20px 0}.metric{background:white;border:1px solid var(--line);padding:17px;border-radius:14px}.metric span{font-size:12px;color:var(--muted)}.metric strong{display:block;font:600 25px 'Playfair Display';color:var(--burgundy);margin-top:7px}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;margin-bottom:17px}.panel h3{font:600 20px 'Playfair Display';margin:0 0 15px;color:var(--burgundy)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:550px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:#8d7d7e;font-size:11px;text-transform:uppercase;letter-spacing:.7px}.status{padding:5px 9px;border-radius:30px;font-size:11px;font-weight:700;background:#f5eee8;color:#82604f}.status.ok{background:#e8f2eb;color:#397251}.status.no{background:#fae9e8;color:#a23e48}.status.wait{background:#fbf1dc;color:#98712d}.progress{height:8px;border-radius:10px;background:#f0e9e5;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--burgundy));border-radius:10px}.empty{text-align:center;padding:30px;color:var(--muted)}.modal-back{position:fixed;inset:0;background:#21151bb0;z-index:50;display:grid;place-items:center;padding:20px}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:18px;padding:24px;box-shadow:0 20px 60px #1d0c15aa}.modal h3{font:600 25px 'Playfair Display';color:var(--burgundy);margin:0 0 18px}.close{float:right;border:0;background:#f4e9e5;border-radius:50%;width:31px;height:31px;color:var(--burgundy)}.toast{position:fixed;right:22px;bottom:22px;background:#34212a;color:white;padding:13px 18px;border-radius:10px;z-index:90;box-shadow:var(--shadow);animation:fade .25s}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.detail-grid>img{width:100%;height:350px;object-fit:cover;border-radius:17px}.pill{border-radius:30px;padding:6px 10px;background:#f4ebe7;font-size:11px;color:var(--burgundy)}.bar{height:10px;background:#f1e9e5;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:var(--gold)}.mobile-menu{display:none}.hide{display:none!important}

<script>
'use strict';
const KEY='wedsync_mvp_v1';
const CATEGORIES=['Makeup Artist','Fotografer','Videografer','Katering','Dekorasi','Wedding Organizer','Busana Pengantin','Undangan','Souvenir','Sewa Perlengkapan'];

const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const id=()=>Math.random().toString(36).slice(2,10);
const dateNow=()=>new Date().toISOString().slice(0,10);
const img=(q)=>`https://images.unsplash.com/${q}?auto=format&fit=crop&w=900&q=80`;
const seedVendors=[
['Atelier Cantika','Makeup Artist','Meulaboh',1800000,'Makeup artist dengan sentuhan natural, soft glam, dan layanan untuk hari istimewa.','photo-1487412720507-e7ab37603c6f'],
['Lensa Cerita Studio','Fotografer','Banda Aceh',2500000,'Dokumentasi candid dan editorial untuk mengabadikan momen pernikahan.','photo-1511285560929-80b456fea0bc'],
['Frame of Love','Videografer','Medan',3200000,'Film wedding sinematik dengan cerita personal dan warna hangat.','photo-1519741497674-611481863552'],
['Dapur Bahagia Catering','Katering','Meulaboh',85000,'Paket prasmanan dengan pilihan menu Nusantara dan layanan kru.','photo-1555244162-803834f70033'],
['Bloom Decor House','Dekorasi','Banda Aceh',4500000,'Dekorasi pelaminan bernuansa modern klasik dan floral.','photo-1519225421980-715cb0215aed'],
['Sakinah Wedding Organizer','Wedding Organizer','Meulaboh',5000000,'Pendampingan persiapan hingga koordinasi pada hari acara.','photo-1511795409834-ef04bbd61622'],

['Kertas Kisah','Undangan','Banda Aceh',3500,'Undangan cetak minimalis dan desain digital yang personal.','photo-1512436991641-6745cdb1723f'],
['Souvenir Senja','Souvenir','Meulaboh',12000,'Souvenir sederhana yang dapat disesuaikan dengan tema acara.','photo-1513201099705-a9746e1e201f'],
['Ruang Pesta Rental','Sewa Perlengkapan','Meulaboh',1500000,'Penyewaan meja, kursi, tenda, dan perlengkapan acara.','photo-1519167758481-83f550bb49b3'],
['Mawar Bridal Makeup','Makeup Artist','Medan',2200000,'Riasan anggun untuk akad dan resepsi dengan konsultasi awal.','photo-1522335789203-aabad1fc54bc'],
['Arunika Visual','Fotografer','Banda Aceh',2900000,'Paket foto dokumentasi dengan album pilihan.','photo-1537633552985-df8429e8048b'],
['Nusa Wedding Film','Videografer','Meulaboh',2700000,'Dokumentasi video highlight untuk momen keluarga.','photo-1532712938310-34cb3982ef74'],
['Selera Puspa','Katering','Medan',95000,'Sajian prasmanan dan stall untuk acara keluarga.','photo-1547592180-85f173990554'],
['Rona Pelaminan','Dekorasi','Meulaboh',3900000,'Dekorasi intimate wedding dan pelaminan bernuansa ivory.','photo-1515934751635-c81c6bc9a2d8']
];
function makeSeed(){
 const users=[{id:'u-customer',nama:'Alya Putri',email:'customer@wedsync.demo',passwordDemo:'demo123',role:'customer',tanggalDibuat:dateNow()},{id:'u-vendor',nama:'Pemilik Atelier Cantika',email:'vendor@wedsync.demo',passwordDemo:'demo123',role:'vendor',tanggalDibuat:dateNow()},{id:'u-admin',nama:'Administrator',email:'admin@wedsync.demo',passwordDemo:'demo123',role:'admin',tanggalDibuat:dateNow()}];
 const vendors=seedVendors.map((v,i)=>({id:'v'+(i+1),userId:i===0?'u-vendor':null,namaUsaha:v[0],kategori:v[1],lokasi:v[2],alamat:v[2]+', Indonesia',deskripsi:v[4],imageUrl:img(v[5]),portfolio:[img(v[5]),img('photo-1519741497674-611481863552'),img('photo-1519225421980-715cb0215aed')],kontak:'6281234567890',ratingSimulasi:(4.5+(i%5)*.1).toFixed(1),statusVerifikasi:'Demo',statusAktif:true,packages:[{id:'p'+(i+1)+'a',namaPaket:'Paket Essential',deskripsi:'Layanan utama untuk acara pernikahan.',harga:v[3],fasilitas:['Konsultasi awal','Layanan sesuai paket','Koordinasi kebutuhan'],durasiLayanan:'1 hari'},{id:'p'+(i+1)+'b',namaPaket:'Paket Signature',deskripsi:'Pilihan layanan dengan fasilitas tambahan.',harga:Math.round(v[3]*1.5),fasilitas:['Konsultasi detail','Layanan premium','Dokumentasi/hasil pilihan'],durasiLayanan:'1 hari'}]}));
 const project={id:'wp1',customerId:'u-customer',namaAcara:'Pernikahan Alya & Rizky',tanggalPernikahan:'2027-06-12',lokasi:'Meulaboh',jumlahTamu:300,totalAnggaran:85000000,daftarBooking:[],progressPersiapan:25};
 const checklist=['Menentukan tanggal dan lokasi','Menentukan anggaran','Memilih katering','Memilih MUA','Memilih fotografer dan videografer','Memilih dekorasi','Memilih busana pengantin','Memilih undangan dan souvenir'].map((n,i)=>({id:'t'+i,weddingProjectId:'wp1',namaTugas:n,kategori:'Persiapan',status:i<2?'Selesai':'Belum Selesai',tanggalTarget:''}));
 const budget=[{id:'b1',weddingProjectId:'wp1',kategori:'Katering',namaPengeluaran:'Estimasi konsumsi',estimasiBiaya:25000000,biayaAktual:0,statusPembayaran:'Belum Dibayar'},{id:'b2',weddingProjectId:'wp1',kategori:'Dekorasi',namaPengeluaran:'Dekorasi acara',estimasiBiaya:12000000,biayaAktual:0,statusPembayaran:'Belum Dibayar'},{id:'b3',weddingProjectId:'wp1',kategori:'Busana',namaPengeluaran:'Busana pengantin',estimasiBiaya:7000000,biayaAktual:0,statusPembayaran:'Belum Dibayar'}];
 return {users,vendors,availability:[],bookings:[],projects:[project],checklist,budget,favorites:[],collaborations:[],categories:[...CATEGORIES]};
}
let db=loadDB(), currentUser=null, page='home', selectedVendor=null, compareIds=[], searchTerm='', filters={cat:'',loc:'',max:''};
function loadDB(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.vendors)return x}catch(e){}const x=makeSeed();saveDB(x);return x}
function saveDB(x=db){localStorage.setItem(KEY,JSON.stringify(x))}
function toast(s){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>root.innerHTML='',2600)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function activeProject(){return db.projects.find(p=>p.customerId===currentUser?.id)||db.projects[0]}
function userBookings(){return db.bookings.filter(b=>b.customerId===currentUser?.id)}
function vendorFor(id){return db.vendors.find(v=>v.id===id)}
function packageFor(v,p){return v?.packages?.find(x=>x.id===p)}
function fmtDate(d){return d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-'}
function statusClass(s){return s==='Diterima'||s==='Selesai'?'ok':s==='Ditolak'?'no':'wait'}
function setPage(p){page=p;selectedVendor=null;render()}
function login(role){currentUser=db.users.find(u=>u.role===role);page=role==='customer'?'customer':role==='vendor'?'vendor':'admin';closeModal();render();toast('Masuk sebagai '+role+' demo')}
function logout(){currentUser=null;page='home';render()}
function openLogin(){showModal(`<h3>Masuk ke WEDSYNC</h3><p class="muted small">Pilih akun demo untuk mencoba alur setiap peran.</p><div class="panel"><b>Customer</b><p class="small muted">customer@wedsync.demo · demo123</p><button class="btn" onclick="login('customer')">Masuk sebagai Customer</button></div><div class="panel"><b>Vendor</b><p class="small muted">vendor@wedsync.demo · demo123</p><button class="btn" onclick="login('vendor')">Masuk sebagai Vendor</button></div><div class="panel"><b>Admin</b><p class="small muted">admin@wedsync.demo · demo123</p><button class="btn" onclick="login('admin')">Masuk sebagai Admin</button></div><p class="small muted">Akun dan password ini hanya untuk simulasi, bukan autentikasi aman.</p>`)}
function showModal(content){document.getElementById('modal-root').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">×</button>${content}</div></div>`}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function header(){return `<header class="topbar"><div class="container nav"><a class="logo" href="#" onclick="setPage('home')">WED<span>SYNC</span></a><nav class="navlinks"><a href="#" onclick="setPage('home')">Beranda</a><a href="#" onclick="setPage('explore')">Cari Vendor</a><a href="#how">Cara Kerja</a></nav><div class="actions">${currentUser?`<span class="small muted">${esc(currentUser.nama)}</span><button class="btn soft" onclick="setPage('${currentUser.role}')">Dashboard</button><button class="btn outline" onclick="logout()">Keluar</button>`:`<button class="btn outline" onclick="openLogin()">Masuk</button><button class="btn" onclick="openLogin()">Mulai Sekarang</button>`}</div></div></header>`}
function vendorCard(v){const fav=db.favorites.some(f=>f.vendorId===v.id&&f.customerId===currentUser?.id);return `<article class="vendor-card"><img src="${v.imageUrl}" alt="${esc(v.namaUsaha)}" onerror="this.src='https://placehold.co/800x500/f3e7e2/642b3b?text=WEDSYNC'"><div class="vendor-body"><div class="row between"><span class="tag">${esc(v.kategori)}</span><span class="small">★ ${v.ratingSimulasi} <span class="muted">(simulasi)</span></span></div><h3>${esc(v.namaUsaha)}</h3><div class="small muted">📍 ${esc(v.lokasi)}</div><p class="small muted">${esc(v.deskripsi.slice(0,88))}…</p><div class="vendor-foot"><div><div class="small muted">Mulai dari</div><div class="price">${money(Math.min(...v.packages.map(p=>p.harga)))}</div></div><div class="row"><button class="btn tiny soft" onclick="toggleFavorite('${v.id}')">${fav?'♥':'♡'}</button><button class="btn tiny" onclick="viewVendor('${v.id}')">Detail</button></div></div><div class="row" style="margin-top:12px"><button class="btn tiny outline" onclick="toggleCompare('${v.id}')">${compareIds.includes(v.id)?'✓ Dibandingkan':'＋ Bandingkan'}</button></div></div></article>`}
function home(){const featured=db.vendors.slice(0,3);return `${header()}<section class="hero"><div class="container hero-grid"><div><div class="eyebrow">Your wedding, beautifully organized</div><h1>Mulai kisah indahmu dengan persiapan yang lebih mudah.</h1><p>Temukan vendor pernikahan pilihan, atur anggaran, dan koordinasikan setiap detail acara dalam satu ruang yang praktis.</p><div class="row" style="margin-top:25px"><button class="btn" onclick="setPage('explore')">Jelajahi Vendor →</button><button class="btn outline" onclick="openLogin()">Gabung sebagai Vendor</button></div><p class="small">✦ Marketplace · Wedding Planner · Vendor Collaboration</p></div><div class="hero-img"><img src="${img('photo-1519741497674-611481863552')}" alt="Dekorasi pernikahan"><div class="hero-note"><b>Make room for moments.</b><div class="small muted">Semua rencana pernikahan, dalam satu tempat.</div></div></div></div></section><section class="section"><div class="container"><div class="section-head"><div><div class="eyebrow">Explore by category</div><h2>Temukan layanan yang kamu butuhkan</h2><p>Pilih kategori untuk mulai menyusun hari istimewamu.</p></div></div><div class="grid categories">${CATEGORIES.map((c,i)=>`<a class="category" href="#" onclick="filters.cat='${c}';setPage('explore')"><div class="cat-icon">${CAT_ICONS[i]}</div><b>${c}</b></a>`).join('')}</div></div></section><section class="section" style="background:#f7f0eb"><div class="container"><div class="section-head"><div><div class="eyebrow">Curated for your day</div><h2>Vendor pilihan minggu ini</h2><p>Inspirasi layanan dari vendor demo WEDSYNC.</p></div><button class="btn outline" onclick="setPage('explore')">Lihat Semua Vendor</button></div><div class="grid vendor-grid">${featured.map(vendorCard).join('')}</div><div class="stats"><div class="stat"><strong>15+</strong><span class="muted">Vendor contoh</span></div><div class="stat"><strong>10</strong><span class="muted">Kategori layanan</span></div><div class="stat"><strong>1 ruang</strong><span class="muted">Untuk rencana pernikahan</span></div></div></div></section><section class="section" id="how"><div class="container"><div class="section-head"><div><div class="eyebrow">Simple steps</div><h2>Persiapan lebih terarah</h2></div></div><div class="grid categories"><div class="panel"><div class="cat-icon">🔎</div><b>1. Temukan</b><p class="muted small">Cari vendor sesuai kategori, lokasi, dan anggaran.</p></div><div class="panel"><div class="cat-icon">♡</div><b>2. Bandingkan</b><p class="muted small">Simpan favorit dan lihat perbedaan paket layanan.</p></div><div class="panel"><div class="cat-icon">🗓️</div><b>3. Rencanakan</b><p class="muted small">Atur checklist, booking, serta anggaran acara.</p></div><div class="panel"><div class="cat-icon">🤝</div><b>4. Kolaborasikan</b><p class="muted small">Pantau vendor dan tugas dalam satu workspace.</p></div><div class="panel"><div class="cat-icon">✨</div><b>5. Siap merayakan</b><p class="muted small">Lihat laporan kesiapan berdasarkan progres aktual.</p></div></div></div></section>${footer()}`}
function footer(){return `<footer class="footer"><div class="container row between"><div><div class="logo">WED<span>SYNC</span></div><p class="small">Wedding Marketplace & Vendor Management Platform</p></div><div class="small">Prototype MVP · Seluruh harga, rating, dan transaksi adalah data simulasi.</div></div></footer>`}
function explore(){let list=db.vendors.filter(v=>v.statusAktif&&(!searchTerm||(`${v.namaUsaha} ${v.kategori} ${v.deskripsi}`).toLowerCase().includes(searchTerm.toLowerCase()))&&(!filters.cat||v.kategori===filters.cat)&&(!filters.loc||v.lokasi.toLowerCase().includes(filters.loc.toLowerCase()))&&(!filters.max||Math.min(...v.packages.map(p=>p.harga))<=Number(filters.max)));return `${header()}<main class="page container"><div class="eyebrow">Wedding marketplace</div><h1 class="page-title">Jelajahi Vendor</h1><p class="muted">Temukan partner terbaik untuk hari istimewamu. <span class="small">Harga dan rating merupakan data simulasi.</span></p><div class="toolbar"><input placeholder="Cari nama vendor atau layanan..." value="${esc(searchTerm)}" oninput="searchTerm=this.value;renderExploreGrid()"><select onchange="filters.cat=this.value;renderExploreGrid()"><option value="">Semua kategori</option>${CATEGORIES.map(c=>`<option ${filters.cat===c?'selected':''}>${c}</option>`).join('')}</select><input placeholder="Lokasi" value="${esc(filters.loc)}" oninput="filters.loc=this.value;renderExploreGrid()" style="max-width:150px"><input type="number" placeholder="Harga maks. (Rp)" value="${esc(filters.max)}" oninput="filters.max=this.value;renderExploreGrid()" style="max-width:170px"><select id="sorter" onchange="renderExploreGrid()"><option value="recommended">Urutan rekomendasi</option><option value="low">Harga terendah</option><option value="high">Harga tertinggi</option><option value="name">Nama A-Z</option></select></div><div id="explore-results" class="grid vendor-grid">${renderVendorList(list)}</div><div id="compare-area">${compareBar()}</div></main>${footer()}`}
function renderVendorList(list){const sort=document.getElementById('sorter')?.value||'recommended';if(sort==='low')list.sort((a,b)=>Math.min(...a.packages.map(p=>p.harga))-Math.min(...b.packages.map(p=>p.harga)));if(sort==='high')list.sort((a,b)=>Math.min(...b.packages.map(p=>p.harga))-Math.min(...a.packages.map(p=>p.harga)));if(sort==='name')list.sort((a,b)=>a.namaUsaha.localeCompare(b.namaUsaha));return list.length?list.map(vendorCard).join(''):`<div class="panel empty" style="grid-column:1/-1">Vendor tidak ditemukan. Coba ubah kata kunci atau filter.</div>`}
function renderExploreGrid(){const root=document.getElementById('explore-results');if(!root)return;const list=db.vendors.filter(v=>v.statusAktif&&(!searchTerm||(`${v.namaUsaha} ${v.kategori} ${v.deskripsi}`).toLowerCase().includes(searchTerm.toLowerCase()))&&(!filters.cat||v.kategori===filters.cat)&&(!filters.loc||v.lokasi.toLowerCase().includes(filters.loc.toLowerCase()))&&(!filters.max||Math.min(...v.packages.map(p=>p.harga))<=Number(filters.max)));root.innerHTML=renderVendorList(list);document.getElementById('compare-area').innerHTML=compareBar()}
function toggleCompare(vid){if(compareIds.includes(vid))compareIds=compareIds.filter(x=>x!==vid);else if(compareIds.length<3)compareIds.push(vid);else return toast('Maksimal membandingkan 3 vendor');renderExploreGrid()}
function compareBar(){if(!compareIds.length)return '';return `<div class="panel" style="margin-top:20px"><div class="row between"><b>Perbandingan vendor (${compareIds.length}/3)</b><div><button class="btn tiny outline" onclick="compareIds=[];renderExploreGrid()">Kosongkan</button> <button class="btn tiny" onclick="showCompare()">Bandingkan sekarang</button></div></div><div class="small muted">${compareIds.map(x=>esc(vendorFor(x)?.namaUsaha||'')).join(' · ')}</div></div>`}
function showCompare(){const vs=compareIds.map(vendorFor).filter(Boolean);showModal(`<h3>Bandingkan Vendor</h3><div class="table-wrap"><table><tr><th>Informasi</th>${vs.map(v=>`<th>${esc(v.namaUsaha)}</th>`).join('')}</tr><tr><td>Kategori</td>${vs.map(v=>`<td>${esc(v.kategori)}</td>`).join('')}</tr><tr><td>Lokasi</td>${vs.map(v=>`<td>${esc(v.lokasi)}</td>`).join('')}</tr><tr><td>Harga mulai</td>${vs.map(v=>`<td>${money(Math.min(...v.packages.map(p=>p.harga)))}</td>`).join('')}</tr><tr><td>Rating simulasi</td>${vs.map(v=>`<td>★ ${v.ratingSimulasi}</td>`).join('')}</tr></table></div>`)}
function viewVendor(vid){selectedVendor=vid;page='detail';render()}
function detail(){const v=vendorFor(selectedVendor);if(!v)return explore();return `${header()}<main class="page container"><button class="btn tiny outline" onclick="setPage('explore')">← Kembali ke katalog</button><div class="detail-grid" style="margin-top:22px"><div><img src="${v.imageUrl}" alt="${esc(v.namaUsaha)}"><div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:10px">${v.portfolio.slice(0,3).map(x=>`<img src="${x}" style="height:95px;width:100%;object-fit:cover;border-radius:10px">`).join('')}</div></div><div><span class="tag">${esc(v.kategori)}</span><h1 class="page-title">${esc(v.namaUsaha)}</h1><p class="muted">📍 ${esc(v.alamat)} · ★ ${v.ratingSimulasi} <span class="small">(rating simulasi)</span></p><p style="line-height:1.8">${esc(v.deskripsi)}</p><div class="panel"><b>Paket layanan</b>${v.packages.map(p=>`<div style="border-top:1px solid var(--line);padding:14px 0;margin-top:10px"><div class="row between"><b>${esc(p.namaPaket)}</b><span class="price">${money(p.harga)}</span></div><p class="small muted">${esc(p.deskripsi)}</p><div class="small muted">${p.fasilitas.map(esc).join(' · ')} · ${esc(p.durasiLayanan)}</div><button class="btn tiny" style="margin-top:10px" onclick="bookingModal('${v.id}','${p.id}')">Pesan Paket</button></div>`).join('')}</div><div class="row"><button class="btn soft" onclick="toggleFavorite('${v.id}')">♡ Simpan Favorit</button><a class="btn outline" target="_blank" rel="noopener" href="https://wa.me/${v.kontak}?text=${encodeURIComponent('Halo, saya tertarik dengan layanan '+v.namaUsaha+' dari WEDSYNC.')}">Hubungi via WhatsApp</a></div><p class="small muted">WhatsApp dibuka sebagai tautan eksternal. Tidak ada pesan otomatis yang dikirim.</p></div></div></main>${footer()}`}
function toggleFavorite(vid){if(!currentUser){openLogin();return}const i=db.favorites.findIndex(f=>f.vendorId===vid&&f.customerId===currentUser.id);if(i>=0)db.favorites.splice(i,1);else db.favorites.push({id:id(),customerId:currentUser.id,vendorId:vid,tanggalDitambahkan:dateNow()});saveDB();toast(i>=0?'Dihapus dari favorit':'Ditambahkan ke favorit');render()}
function bookingModal(vid,pid){if(!currentUser||currentUser.role!=='customer'){openLogin();return}const p=activeProject();showModal(`<h3>Ajukan Booking</h3><form onsubmit="submitBooking(event,'${vid}','${pid}')"><div class="field"><label>Proyek pernikahan</label><select name="project" required>${db.projects.filter(x=>x.customerId===currentUser.id).map(x=>`<option value="${x.id}">${esc(x.namaAcara)}</option>`).join('')}</select></div><div class="field"><label>Tanggal acara</label><input name="date" type="date" min="${dateNow()}" value="${p?.tanggalPernikahan||''}" required></div><div class="field"><label>Lokasi acara</label><input name="location" value="${esc(p?.lokasi||'')}" required></div><div class="field"><label>Catatan tambahan</label><textarea name="note" rows="3" placeholder="Tuliskan kebutuhan khusus..."></textarea></div><p class="small muted">Booking akan berstatus Menunggu Konfirmasi. Pembayaran hanya dicatat sebagai simulasi.</p><button class="btn" type="submit">Kirim Permintaan</button></form>`)}
function submitBooking(e,vid,pid){e.preventDefault();const f=new FormData(e.target),v=vendorFor(vid),p=packageFor(v,pid),date=f.get('date');const conflict=db.bookings.some(b=>b.vendorId===vid&&b.tanggalAcara===date&&['Menunggu Konfirmasi','Diterima'].includes(b.statusBooking));if(conflict)return toast('Tanggal tersebut sudah memiliki booking aktif untuk vendor ini.');const b={id:id(),customerId:currentUser.id,vendorId:vid,paketId:pid,weddingProjectId:f.get('project'),tanggalAcara:date,lokasiAcara:f.get('location'),catatan:f.get('note'),totalHarga:p.harga,jumlahDP:0,sisaPembayaran:p.harga,statusBooking:'Menunggu Konfirmasi',statusPembayaran:'Belum Dibayar',tanggalBooking:dateNow()};db.bookings.push(b);const pr=db.projects.find(x=>x.id===b.weddingProjectId);if(pr&&!pr.daftarBooking.includes(b.id))pr.daftarBooking.push(b.id);saveDB();closeModal();toast('Permintaan booking berhasil dibuat');setPage('customer')}
function customerNav(){return `<div class="side-label">Workspace customer</div>${[['customer','▦','Overview'],['planner','☑','Wedding Planner'],['budget','◫','Budget Planner'],['bookings','▤','My Bookings'],['favorites','♡','Favorites'],['collab','🤝','Collaboration'],['readiness','✧','Readiness Report']].map(x=>`<a class="side-link ${page===x[0]?'active':''}" href="#" onclick="setPage('${x[0]}')">${x[1]} ${x[2]}</a>`).join('')}`}
function vendorNav(){return `<div class="side-label">Vendor workspace</div>${[['vendor','▦','Overview'],['profile','⌂','Business Profile'],['services','▤','My Services'],['requests','✉','Booking Requests'],['availability','▦','Availability'],['customers','♙','Customer List'],['transactions','◫','Transactions']].map(x=>`<a class="side-link ${page===x[0]?'active':''}" href="#" onclick="setPage('${x[0]}')">${x[1]} ${x[2]}</a>`).join('')}`}
function adminNav(){return `<div class="side-label">Administration</div>${[['admin','▦','Overview'],['manageVendors','♧','Manage Vendors'],['manageUsers','♙','Manage Users'],['manageCategories','▤','Categories'],['manageBookings','▣','Bookings']].map(x=>`<a class="side-link ${page===x[0]?'active':''}" href="#" onclick="setPage('${x[0]}')">${x[1]} ${x[2]}</a>`).join('')}`}
function shell(nav,content){return `${header()}<main class="page container"><div class="dashboard"><aside class="sidebar">${nav}<div class="side-label">Akun</div><a class="side-link" href="#" onclick="logout()">↪ Keluar</a><p class="small muted" style="padding:8px">Mode demo · Data tersimpan lokal</p></aside><section class="dash-content">${content}</section></div></main>${footer()}`}
function requireRole(role){if(!currentUser||currentUser.role!==role){openLogin();return false}return true}
function customer(){if(!requireRole('customer'))return '';const p=activeProject(),bs=userBookings(),done=db.checklist.filter(t=>t.weddingProjectId===p?.id&&t.status==='Selesai').length,total=db.checklist.filter(t=>t.weddingProjectId===p?.id).length,spent=db.budget.filter(x=>x.weddingProjectId===p?.id).reduce((s,x)=>s+Number(x.biayaAktual||0),0);return shell(customerNav(),`<div class="eyebrow">Customer dashboard</div><h1 class="page-title">Halo, ${esc(currentUser.nama.split(' ')[0])} ✨</h1><p class="muted">Pantau rencana pernikahanmu dari satu tempat.</p><div class="cards-4"><div class="metric"><span>Progress persiapan</span><strong>${total?Math.round(done/total*100):0}%</strong></div><div class="metric"><span>Total booking</span><strong>${bs.length}</strong></div><div class="metric"><span>Vendor favorit</span><strong>${db.favorites.filter(x=>x.customerId===currentUser.id).length}</strong></div><div class="metric"><span>Pengeluaran aktual</span><strong style="font-size:18px">${money(spent)}</strong></div></div><div class="panel"><div class="row between"><div><h3>${esc(p?.namaAcara||'Belum ada proyek')}</h3><p class="muted small">🗓️ ${fmtDate(p?.tanggalPernikahan)} · 📍 ${esc(p?.lokasi||'-')}</p></div><button class="btn tiny" onclick="setPage('planner')">Kelola Planner</button></div><div class="progress"><i style="width:${total?done/total*100:0}%"></i></div><p class="small muted">${done} dari ${total} tugas persiapan selesai</p></div><div class="panel"><div class="row between"><h3>Booking terbaru</h3><button class="btn tiny outline" onclick="setPage('bookings')">Lihat semua</button></div>${bs.length?bs.slice(-4).reverse().map(bookingRow).join(''):'<div class="empty">Belum ada booking. Mulai jelajahi vendor untuk menemukan layanan yang sesuai.</div>'}</div><div class="row"><button class="btn" onclick="setPage('explore')">Cari Vendor</button><button class="btn soft" onclick="setPage('readiness')">Lihat Wedding Readiness</button></div>`)}
function bookingRow(b, vendorSide=false){const v=vendorFor(b.vendorId);return `<div class="row between" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b>${esc(v?.namaUsaha||'Vendor')}</b><div class="small muted">${fmtDate(b.tanggalAcara)} · ${money(b.totalHarga)}</div></div><div class="row"><span class="status ${statusClass(b.statusBooking)}">${b.statusBooking}</span>${vendorSide?`<button class="btn tiny outline" onclick="setPage('requests')">Buka</button>`:''}</div></div>`}
function planner(){if(!requireRole('customer'))return '';let p=activeProject();if(!p)return shell(customerNav(),`<h1 class="page-title">Wedding Planner</h1><button class="btn" onclick="projectModal()">Buat Proyek</button>`);let tasks=db.checklist.filter(t=>t.weddingProjectId===p.id),progress=tasks.length?Math.round(tasks.filter(t=>t.status==='Selesai').length/tasks.length*100):0;return shell(customerNav(),`<div class="row between"><div><div class="eyebrow">Plan every lovely detail</div><h1 class="page-title">Wedding Planner</h1></div><button class="btn" onclick="projectModal()">＋ Proyek Baru</button></div><div class="panel"><div class="row between"><div><h3>${esc(p.namaAcara)}</h3><p class="small muted">${fmtDate(p.tanggalPernikahan)} · ${esc(p.lokasi)} · ${p.jumlahTamu} tamu</p></div><button class="btn tiny outline" onclick="projectModal('${p.id}')">Edit acara</button></div><div class="row between"><b>Progress persiapan</b><b>${progress}%</b></div><div class="progress"><i style="width:${progress}%"></i></div></div><div class="panel"><div class="row between"><h3>Checklist persiapan</h3><button class="btn tiny soft" onclick="addTask()">＋ Tambah tugas</button></div>${tasks.map(t=>`<label class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><input type="checkbox" ${t.status==='Selesai'?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><span style="${t.status==='Selesai'?'text-decoration:line-through;color:#998':''}">${esc(t.namaTugas)}</span><span class="small muted" style="margin-left:auto">${t.kategori}</span></label>`).join('')}</div><div class="panel"><h3>Vendor yang sudah dipesan</h3>${db.bookings.filter(b=>b.weddingProjectId===p.id&&b.statusBooking==='Diterima').map(b=>bookingRow(b)).join('')||'<div class="empty">Vendor yang dikonfirmasi akan muncul di sini.</div>'}</div>`)}
function projectModal(pid){const p=db.projects.find(x=>x.id===pid);showModal(`<h3>${p?'Edit':'Buat'} Proyek Pernikahan</h3><form onsubmit="saveProject(event,'${pid||''}')"><div class="field"><label>Nama acara</label><input name="name" required value="${esc(p?.namaAcara||'')}"></div><div class="field"><label>Tanggal pernikahan</label><input type="date" name="date" required value="${p?.tanggalPernikahan||''}"></div><div class="field"><label>Lokasi</label><input name="location" required value="${esc(p?.lokasi||'')}"></div><div class="field"><label>Estimasi jumlah tamu</label><input type="number" name="guests" min="1" required value="${p?.jumlahTamu||100}"></div><div class="field"><label>Total anggaran (Rp)</label><input type="number" name="budget" min="0" value="${p?.totalAnggaran||0}"></div><button class="btn">Simpan Proyek</button></form>`)}
function saveProject(e,pid){e.preventDefault();const f=new FormData(e.target);if(pid){const p=db.projects.find(x=>x.id===pid);Object.assign(p,{namaAcara:f.get('name'),tanggalPernikahan:f.get('date'),lokasi:f.get('location'),jumlahTamu:+f.get('guests'),totalAnggaran:+f.get('budget')})}else db.projects.push({id:id(),customerId:currentUser.id,namaAcara:f.get('name'),tanggalPernikahan:f.get('date'),lokasi:f.get('location'),jumlahTamu:+f.get('guests'),totalAnggaran:+f.get('budget'),daftarBooking:[],progressPersiapan:0});saveDB();closeModal();setPage('planner');toast('Proyek tersimpan')}
function toggleTask(tid,checked){const t=db.checklist.find(x=>x.id===tid);t.status=checked?'Selesai':'Belum Selesai';saveDB();render()}
function addTask(){showModal(`<h3>Tambah Tugas</h3><form onsubmit="saveTask(event)"><div class="field"><label>Nama tugas</label><input name="name" required></div><div class="field"><label>Kategori</label><input name="cat" value="Persiapan"></div><button class="btn">Tambah</button></form>`)}
function saveTask(e){e.preventDefault();const f=new FormData(e.target);db.checklist.push({id:id(),weddingProjectId:activeProject().id,namaTugas:f.get('name'),kategori:f.get('cat'),status:'Belum Selesai',tanggalTarget:''});saveDB();closeModal();render()}
function budget(){if(!requireRole('customer'))return '';const p=activeProject();if(!p)return shell(customerNav(),'<h1>Budget Planner</h1>');const rows=db.budget.filter(x=>x.weddingProjectId===p.id),spent=rows.reduce((s,x)=>s+Number(x.biayaAktual||0),0),remaining=p.totalAnggaran-spent,pct=p.totalAnggaran?Math.round(spent/p.totalAnggaran*100):0;return shell(customerNav(),`<div class="row between"><div><div class="eyebrow">Plan within your means</div><h1 class="page-title">Budget Planner</h1></div><button class="btn" onclick="budgetModal()">＋ Catat biaya</button></div><div class="cards-4"><div class="metric"><span>Total anggaran</span><strong>${money(p.totalAnggaran)}</strong></div><div class="metric"><span>Pengeluaran aktual</span><strong>${money(spent)}</strong></div><div class="metric"><span>Sisa anggaran</span><strong style="color:${remaining<0?'var(--red)':'var(--green)'}">${money(remaining)}</strong></div><div class="metric"><span>Penggunaan</span><strong>${pct}%</strong></div></div>${remaining<0?'<div class="panel" style="border-color:#e8b8b8;color:var(--red)">⚠ Pengeluaran melebihi total anggaran.</div>':''}<div class="panel"><h3>Rincian pengeluaran</h3>${rows.length?`<div class="table-wrap"><table><tr><th>Kategori</th><th>Pengeluaran</th><th>Estimasi</th><th>Aktual</th><th></th></tr>${rows.map(x=>`<tr><td>${esc(x.kategori)}</td><td>${esc(x.namaPengeluaran)}</td><td>${money(x.estimasiBiaya)}</td><td>${money(x.biayaAktual)}</td><td><button class="btn tiny outline" onclick="editBudget('${x.id}')">Edit</button> <button class="btn tiny danger" onclick="deleteBudget('${x.id}')">×</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada rincian anggaran.</div>'}</div><div class="panel"><h3>Visualisasi penggunaan anggaran</h3><div class="row between"><span class="small muted">Terpakai ${pct}%</span><b>${money(spent)} / ${money(p.totalAnggaran)}</b></div><div class="bar" style="margin:12px 0"><span style="width:${Math.min(100,Math.max(0,pct))}%"></span></div></div>`)}
function budgetModal(bid){const b=db.budget.find(x=>x.id===bid);showModal(`<h3>${b?'Ubah':'Tambah'} Pengeluaran</h3><form onsubmit="saveBudget(event,'${bid||''}')"><div class="field"><label>Kategori</label><select name="cat">${['Katering','Dekorasi','MUA','Fotografi','Videografi','Busana','Undangan','Souvenir','WO','Lainnya'].map(c=>`<option ${b?.kategori===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Nama pengeluaran</label><input name="name" required value="${esc(b?.namaPengeluaran||'')}"></div><div class="field"><label>Estimasi biaya (Rp)</label><input name="estimate" type="number" min="0" value="${b?.estimasiBiaya||0}"></div><div class="field"><label>Biaya aktual (Rp)</label><input name="actual" type="number" min="0" value="${b?.biayaAktual||0}"></div><button class="btn">Simpan</button></form>`)}
function editBudget(id){budgetModal(id)}
function saveBudget(e,bid){e.preventDefault();const f=new FormData(e.target),obj={weddingProjectId:activeProject().id,kategori:f.get('cat'),namaPengeluaran:f.get('name'),estimasiBiaya:+f.get('estimate'),biayaAktual:+f.get('actual'),statusPembayaran:'Belum Dibayar'};if(bid)Object.assign(db.budget.find(x=>x.id===bid),obj);else db.budget.push({id:id(),...obj});saveDB();closeModal();setPage('budget');toast('Anggaran diperbarui')}
function deleteBudget(bid){if(confirm('Hapus catatan pengeluaran ini?')){db.budget=db.budget.filter(x=>x.id!==bid);saveDB();render()}}
function bookings(){if(!requireRole('customer'))return '';const bs=userBookings();return shell(customerNav(),`<div class="eyebrow">Your reservations</div><h1 class="page-title">My Bookings</h1><div class="panel">${bs.length?`<div class="table-wrap"><table><tr><th>Vendor</th><th>Paket</th><th>Tanggal</th><th>Total</th><th>Status</th></tr>${bs.map(b=>`<tr><td>${esc(vendorFor(b.vendorId)?.namaUsaha||'')}</td><td>${esc(packageFor(vendorFor(b.vendorId),b.paketId)?.namaPaket||'')}</td><td>${fmtDate(b.tanggalAcara)}</td><td>${money(b.totalHarga)}</td><td><span class="status ${statusClass(b.statusBooking)}">${b.statusBooking}</span></td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada pemesanan.</div>'}</div>`)}
function favorites(){if(!requireRole('customer'))return '';const vs=db.favorites.filter(f=>f.customerId===currentUser.id).map(f=>vendorFor(f.vendorId)).filter(Boolean);return shell(customerNav(),`<h1 class="page-title">Vendor Favorit</h1><p class="muted">Daftar vendor yang kamu simpan.</p><div class="grid vendor-grid">${vs.length?vs.map(vendorCard).join(''):'<div class="panel empty" style="grid-column:1/-1">Belum ada vendor favorit.</div>'}</div>`)}
function recommendations(){const p=activeProject(),needs=['Makeup Artist','Fotografer','Katering','Dekorasi'];return db.vendors.filter(v=>v.statusAktif).map(v=>{let score=0,reasons=[];if(needs.includes(v.kategori)){score+=3;reasons.push('kategori umum persiapan acara')}if(v.lokasi.toLowerCase()===String(p?.lokasi||'').toLowerCase()){score+=2;reasons.push('lokasi sama dengan acara')}if(Math.min(...v.packages.map(x=>x.harga))<=(p?.totalAnggaran||0)*.15){score++;reasons.push('harga awal relatif sesuai alokasi anggaran')}if(v.ratingSimulasi>=4.8){score++;reasons.push('rating simulasi tinggi')}const booked=db.bookings.some(b=>b.vendorId===v.id&&b.tanggalAcara===p?.tanggalPernikahan&&['Diterima','Menunggu Konfirmasi'].includes(b.statusBooking));if(!booked){score++;reasons.push('belum ada booking aktif pada tanggal proyek')}return {v,score,reasons,booked}}).sort((a,b)=>b.score-a.score).slice(0,5)}
function collab(){if(!requireRole('customer'))return '';const p=activeProject(),accepted=db.bookings.filter(b=>b.weddingProjectId===p?.id&&b.statusBooking==='Diterima');const tasks=db.collaborations.filter(c=>c.weddingProjectId===p?.id);return shell(customerNav(),`<div class="eyebrow">One team, one celebration</div><h1 class="page-title">Collaboration Workspace</h1><p class="muted">Vendor dengan booking berstatus Diterima ditampilkan dalam ruang kolaborasi.</p><div class="panel"><h3>${esc(p?.namaAcara||'Proyek pernikahan')}</h3>${accepted.length?accepted.map(b=>{const v=vendorFor(b.vendorId),t=tasks.find(x=>x.vendorId===v.id);return `<div class="row between" style="padding:13px 0;border-bottom:1px solid var(--line)"><div><b>${esc(v.namaUsaha)}</b><div class="small muted">${esc(v.kategori)} · ${fmtDate(b.tanggalAcara)}</div><div class="small">${esc(t?.namaTugas||'Pelaksanaan layanan sesuai paket')}</div></div><div><span class="status ${t?.statusPekerjaan==='Selesai'?'ok':'wait'}">${t?.statusPekerjaan||'Belum Dimulai'}</span><button class="btn tiny outline" onclick="collabTask('${v.id}')">Atur tugas</button></div></div>`}).join(''):'<div class="empty">Vendor akan masuk ke workspace setelah booking diterima.</div>'}</div><div class="panel"><h3>Jadwal dan potensi benturan</h3><p class="small muted">Pemeriksaan demo berdasarkan tanggal acara vendor yang dikonfirmasi.</p>${accepted.length>1?'<span class="status wait">Periksa kembali kebutuhan waktu antarvendor pada hari acara.</span>':'<span class="status ok">Belum ada indikasi benturan tanggal antarbooking yang dikonfirmasi.</span>'}</div>`)}
function collabTask(vid){const p=activeProject(),old=db.collaborations.find(x=>x.weddingProjectId===p.id&&x.vendorId===vid);showModal(`<h3>Tugas Kolaborasi</h3><form onsubmit="saveCollab(event,'${vid}')"><div class="field"><label>Nama tugas</label><input name="task" required value="${esc(old?.namaTugas||'Koordinasi layanan pada hari acara')}"></div><div class="field"><label>Tanggal mulai</label><input type="date" name="start" value="${old?.tanggalMulai||p.tanggalPernikahan}"></div><div class="field"><label>Tanggal selesai</label><input type="date" name="end" value="${old?.tanggalSelesai||p.tanggalPernikahan}"></div><div class="field"><label>Status pekerjaan</label><select name="status">${['Belum Dimulai','Sedang Berlangsung','Selesai'].map(x=>`<option ${old?.statusPekerjaan===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Catatan</label><textarea name="note">${esc(old?.catatan||'')}</textarea></div><button class="btn">Simpan Tugas</button></form>`)}
function saveCollab(e,vid){e.preventDefault();const f=new FormData(e.target),p=activeProject(),old=db.collaborations.find(x=>x.weddingProjectId===p.id&&x.vendorId===vid),o={weddingProjectId:p.id,vendorId:vid,namaTugas:f.get('task'),tanggalMulai:f.get('start'),tanggalSelesai:f.get('end'),statusPekerjaan:f.get('status'),catatan:f.get('note')};if(old)Object.assign(old,o);else db.collaborations.push({id:id(),...o});saveDB();closeModal();render()}
function readiness(){if(!requireRole('customer'))return '';const p=activeProject(),tasks=db.checklist.filter(t=>t.weddingProjectId===p?.id),done=tasks.filter(t=>t.status==='Selesai').length,bs=db.bookings.filter(b=>b.weddingProjectId===p?.id),pending=bs.filter(b=>b.statusBooking==='Menunggu Konfirmasi').length,accepted=bs.filter(b=>b.statusBooking==='Diterima').length,budgetRows=db.budget.filter(x=>x.weddingProjectId===p?.id),spent=budgetRows.reduce((s,x)=>s+x.biayaAktual,0),score=Math.round((tasks.length?done/tasks.length*55:0)+(bs.length?accepted/bs.length*30:0)+(p?.totalAnggaran>0?15:0));const suggestions=[];if(done<tasks.length)suggestions.push(`${tasks.length-done} checklist persiapan masih belum selesai.`);if(pending)suggestions.push(`${pending} booking masih menunggu konfirmasi vendor.`);if(!p?.totalAnggaran)suggestions.push('Atur total anggaran agar pemantauan biaya lebih lengkap.');if(!budgetRows.length)suggestions.push('Tambahkan rincian anggaran untuk kebutuhan utama.');if(!suggestions.length)suggestions.push('Pertahankan koordinasi dengan vendor dan perbarui status tugas secara berkala.');return shell(customerNav(),`<div class="eyebrow">A clear view of your progress</div><h1 class="page-title">Wedding Readiness Report</h1><p class="muted">Indikator berbasis checklist, booking, dan anggaran. Bukan prediksi AI.</p><div class="panel"><div class="row between"><div><div class="small muted">Indikator kesiapan</div><div style="font:600 48px 'Playfair Display';color:var(--burgundy)">${score}%</div></div><div style="width:55%"><div class="progress"><i style="width:${score}%"></i></div><p class="small muted">Skor aturan sederhana dari data proyek saat ini.</p></div></div></div><div class="cards-4"><div class="metric"><span>Checklist selesai</span><strong>${done}/${tasks.length}</strong></div><div class="metric"><span>Booking diterima</span><strong>${accepted}</strong></div><div class="metric"><span>Menunggu konfirmasi</span><strong>${pending}</strong></div><div class="metric"><span>Budget terpakai</span><strong>${p?.totalAnggaran?Math.round(spent/p.totalAnggaran*100):0}%</strong></div></div><div class="panel"><h3>Hal yang perlu diperhatikan</h3>${suggestions.map(s=>`<p>• ${esc(s)}</p>`).join('')}</div><div class="panel"><h3>Saran tindakan berikutnya</h3><button class="btn tiny" onclick="setPage('planner')">Perbarui checklist</button> <button class="btn tiny soft" onclick="setPage('bookings')">Periksa booking</button> <button class="btn tiny outline" onclick="setPage('budget')">Atur anggaran</button></div>`)}
function vendor(){if(!requireRole('vendor'))return '';const v=db.vendors.find(x=>x.userId===currentUser.id)||db.vendors[0],bs=db.bookings.filter(b=>b.vendorId===v.id),pending=bs.filter(b=>b.statusBooking==='Menunggu Konfirmasi').length,revenue=bs.filter(b=>b.statusBooking==='Diterima'||b.statusBooking==='Selesai').reduce((s,b)=>s+b.jumlahDP,0);return shell(vendorNav(),`<div class="eyebrow">Business dashboard</div><h1 class="page-title">Selamat datang, ${esc(v.namaUsaha)}</h1><p class="muted">Kelola layanan dan pantau permintaan pelanggan.</p><div class="cards-4"><div class="metric"><span>Total booking</span><strong>${bs.length}</strong></div><div class="metric"><span>Perlu konfirmasi</span><strong>${pending}</strong></div><div class="metric"><span>Pesanan aktif</span><strong>${bs.filter(b=>b.statusBooking==='Diterima').length}</strong></div><div class="metric"><span>DP tercatat</span><strong style="font-size:18px">${money(revenue)}</strong></div></div><div class="panel"><div class="row between"><h3>Permintaan terbaru</h3><button class="btn tiny outline" onclick="setPage('requests')">Kelola booking</button></div>${bs.length?bs.slice().reverse().slice(0,5).map(b=>bookingRow(b,true)).join(''):'<div class="empty">Belum ada permintaan booking.</div>'}</div><div class="panel"><h3>Pengingat</h3><p class="small muted">Pastikan profil, paket layanan, dan kalender ketersediaan selalu diperbarui. Data transaksi pada prototype ini bersifat simulasi.</p></div>`)}
function vendorOwn(){return db.vendors.find(x=>x.userId===currentUser?.id)||db.vendors[0]}
function profile(){if(!requireRole('vendor'))return '';const v=vendorOwn();return shell(vendorNav(),`<h1 class="page-title">Business Profile</h1><div class="panel"><form onsubmit="saveProfile(event)"><div class="field"><label>Nama usaha</label><input name="name" required value="${esc(v.namaUsaha)}"></div><div class="field"><label>Kategori</label><select name="cat">${CATEGORIES.map(c=>`<option ${v.kategori===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Lokasi kota</label><input name="loc" required value="${esc(v.lokasi)}"></div><div class="field"><label>Alamat</label><input name="address" value="${esc(v.alamat)}"></div><div class="field"><label>Deskripsi</label><textarea name="desc" rows="4">${esc(v.deskripsi)}</textarea></div><div class="field"><label>Nomor WhatsApp (format internasional tanpa +)</label><input name="contact" value="${esc(v.kontak)}"></div><button class="btn">Simpan Profil</button></form></div>`)}
function saveProfile(e){e.preventDefault();const f=new FormData(e.target),v=vendorOwn();Object.assign(v,{namaUsaha:f.get('name'),kategori:f.get('cat'),lokasi:f.get('loc'),alamat:f.get('address'),deskripsi:f.get('desc'),kontak:f.get('contact')});saveDB();toast('Profil usaha diperbarui');render()}
function services(){if(!requireRole('vendor'))return '';const v=vendorOwn();return shell(vendorNav(),`<div class="row between"><h1 class="page-title">My Services</h1><button class="btn" onclick="serviceModal()">＋ Tambah Paket</button></div><div class="panel">${v.packages.map(p=>`<div class="row between" style="padding:14px 0;border-bottom:1px solid var(--line)"><div><b>${esc(p.namaPaket)}</b><div class="small muted">${esc(p.deskripsi)} · ${esc(p.durasiLayanan)}</div><div class="price">${money(p.harga)}</div></div><div><button class="btn tiny outline" onclick="serviceModal('${p.id}')">Edit</button> <button class="btn tiny danger" onclick="deleteService('${p.id}')">Hapus</button></div></div>`).join('')}</div><p class="small muted">Foto portofolio demo: ${v.portfolio.length} gambar contoh tersimpan pada profil vendor.</p>`)}
function serviceModal(pid){const v=vendorOwn(),p=v.packages.find(x=>x.id===pid);showModal(`<h3>${p?'Edit':'Tambah'} Paket Layanan</h3><form onsubmit="saveService(event,'${pid||''}')"><div class="field"><label>Nama paket</label><input name="name" required value="${esc(p?.namaPaket||'')}"></div><div class="field"><label>Deskripsi</label><textarea name="desc" required>${esc(p?.deskripsi||'')}</textarea></div><div class="field"><label>Harga (Rp)</label><input name="price" type="number" min="0" required value="${p?.harga||''}"></div><div class="field"><label>Fasilitas (pisahkan dengan koma)</label><input name="fac" value="${esc(p?.fasilitas?.join(', ')||'')}"></div><div class="field"><label>Durasi layanan</label><input name="duration" value="${esc(p?.durasiLayanan||'1 hari')}"></div><button class="btn">Simpan Paket</button></form>`)}
function saveService(e,pid){e.preventDefault();const f=new FormData(e.target),v=vendorOwn(),obj={namaPaket:f.get('name'),deskripsi:f.get('desc'),harga:+f.get('price'),fasilitas:f.get('fac').split(',').map(x=>x.trim()).filter(Boolean),durasiLayanan:f.get('duration')};if(pid)Object.assign(v.packages.find(x=>x.id===pid),obj);else v.packages.push({id:id(),...obj});saveDB();closeModal();render();toast('Paket layanan tersimpan')}
function deleteService(pid){const v=vendorOwn();if(v.packages.length<2)return toast('Vendor harus memiliki minimal satu paket.');if(confirm('Hapus paket ini?')){v.packages=v.packages.filter(p=>p.id!==pid);saveDB();render()}}
function requests(){if(!requireRole('vendor'))return '';const v=vendorOwn(),bs=db.bookings.filter(b=>b.vendorId===v.id);return shell(vendorNav(),`<h1 class="page-title">Booking Requests</h1><div class="panel">${bs.length?`<div class="table-wrap"><table><tr><th>Customer</th><th>Tanggal</th><th>Paket</th><th>Total</th><th>Status</th><th>Aksi</th></tr>${bs.map(b=>`<tr><td>${esc(db.users.find(u=>u.id===b.customerId)?.nama||'Customer')}</td><td>${fmtDate(b.tanggalAcara)}</td><td>${esc(packageFor(v,b.paketId)?.namaPaket||'-')}</td><td>${money(b.totalHarga)}</td><td><span class="status ${statusClass(b.statusBooking)}">${b.statusBooking}</span></td><td>${b.statusBooking==='Menunggu Konfirmasi'?`<button class="btn tiny" onclick="updateBooking('${b.id}','Diterima')">Terima</button> <button class="btn tiny danger" onclick="updateBooking('${b.id}','Ditolak')">Tolak</button>`:b.statusBooking==='Diterima'?`<button class="btn tiny outline" onclick="updateBooking('${b.id}','Selesai')">Tandai Selesai</button>`:'-'}</td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada permintaan booking.</div>'}</div>`)}
function updateBooking(bid,status){const b=db.bookings.find(x=>x.id===bid);if(status==='Diterima'){const conflict=db.bookings.some(x=>x.id!==bid&&x.vendorId===b.vendorId&&x.tanggalAcara===b.tanggalAcara&&['Diterima'].includes(x.statusBooking));if(conflict)return toast('Tidak dapat menerima: tanggal sudah dipesan.')}b.statusBooking=status;saveDB();toast('Status booking diperbarui');render()}
function availability(){if(!requireRole('vendor'))return '';const v=vendorOwn(),rows=db.availability.filter(x=>x.vendorId===v.id),booked=db.bookings.filter(x=>x.vendorId===v.id&&['Diterima','Menunggu Konfirmasi'].includes(x.statusBooking));return shell(vendorNav(),`<div class="row between"><h1 class="page-title">Availability Calendar</h1><button class="btn" onclick="availabilityModal()">＋ Atur Tanggal</button></div><div class="panel"><h3>Tanggal booking aktif</h3>${booked.map(b=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${fmtDate(b.tanggalAcara)}</span><span class="status ${statusClass(b.statusBooking)}">${b.statusBooking}</span></div>`).join('')||'<div class="empty">Belum ada booking aktif.</div>'}</div><div class="panel"><h3>Pengaturan ketersediaan</h3>${rows.map(r=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${fmtDate(r.tanggal)}</span><span class="status ${r.status==='tersedia'?'ok':'no'}">${r.status}</span><button class="btn tiny danger" onclick="removeAvailability('${r.id}')">Hapus</button></div>`).join('')||'<div class="empty">Belum ada tanggal yang diatur.</div>'}</div>`)}
function availabilityModal(){showModal(`<h3>Atur Ketersediaan</h3><form onsubmit="saveAvailability(event)"><div class="field"><label>Tanggal</label><input type="date" name="date" min="${dateNow()}" required></div><div class="field"><label>Status</label><select name="status"><option value="tersedia">Tersedia</option><option value="tidak tersedia">Tidak tersedia</option></select></div><div class="field"><label>Catatan</label><input name="note"></div><button class="btn">Simpan</button></form>`)}
function saveAvailability(e){e.preventDefault();const f=new FormData(e.target),v=vendorOwn(),old=db.availability.find(x=>x.vendorId===v.id&&x.tanggal===f.get('date'));if(old)Object.assign(old,{status:f.get('status'),catatan:f.get('note')});else db.availability.push({id:id(),vendorId:v.id,tanggal:f.get('date'),status:f.get('status'),catatan:f.get('note')});saveDB();closeModal();render()}
function removeAvailability(x){db.availability=db.availability.filter(a=>a.id!==x);saveDB();render()}
function customers(){if(!requireRole('vendor'))return '';const v=vendorOwn(),ids=[...new Set(db.bookings.filter(b=>b.vendorId===v.id).map(b=>b.customerId))],users=ids.map(x=>db.users.find(u=>u.id===x)).filter(Boolean);return shell(vendorNav(),`<h1 class="page-title">Customer List</h1><div class="panel">${users.length?users.map(u=>`<div class="row between" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b>${esc(u.nama)}</b><div class="small muted">${esc(u.email)}</div></div><span class="pill">Pelanggan</span></div>`).join(''):'<div class="empty">Belum ada pelanggan dari booking.</div>'}</div>`)}
function transactions(){if(!requireRole('vendor'))return '';const v=vendorOwn(),bs=db.bookings.filter(b=>b.vendorId===v.id);return shell(vendorNav(),`<h1 class="page-title">Transaction History</h1><p class="muted">Pencatatan pembayaran simulasi, bukan transaksi uang sungguhan.</p><div class="panel">${bs.length?`<div class="table-wrap"><table><tr><th>Booking</th><th>Total</th><th>DP tercatat</th><th>Sisa</th><th>Status pembayaran</th><th></th></tr>${bs.map(b=>`<tr><td>${esc(db.users.find(u=>u.id===b.customerId)?.nama||'Customer')}<div class="small muted">${fmtDate(b.tanggalAcara)}</div></td><td>${money(b.totalHarga)}</td><td>${money(b.jumlahDP)}</td><td>${money(b.sisaPembayaran)}</td><td>${b.statusPembayaran}</td><td><button class="btn tiny outline" onclick="paymentModal('${b.id}')">Catat</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada transaksi.</div>'}</div>`)}
function paymentModal(bid){const b=db.bookings.find(x=>x.id===bid);showModal(`<h3>Catat Pembayaran Simulasi</h3><p class="small muted">Total ${money(b.totalHarga)} · DP saat ini ${money(b.jumlahDP)}</p><form onsubmit="savePayment(event,'${bid}')"><div class="field"><label>Jumlah pembayaran yang dicatat (Rp)</label><input type="number" name="amount" min="0" max="${b.sisaPembayaran}" required></div><button class="btn">Simpan Catatan</button></form>`)}
function savePayment(e,bid){e.preventDefault();const b=db.bookings.find(x=>x.id===bid),amount=+new FormData(e.target).get('amount');b.jumlahDP=Math.min(b.totalHarga,b.jumlahDP+amount);b.sisaPembayaran=Math.max(0,b.totalHarga-b.jumlahDP);b.statusPembayaran=b.sisaPembayaran===0?'Lunas':'DP Tercatat';saveDB();closeModal();render();toast('Pembayaran simulasi dicatat')}
function admin(){if(!requireRole('admin'))return '';return shell(adminNav(),`<div class="eyebrow">Platform administration</div><h1 class="page-title">Admin Dashboard</h1><div class="cards-4"><div class="metric"><span>Customer</span><strong>${db.users.filter(x=>x.role==='customer').length}</strong></div><div class="metric"><span>Vendor</span><strong>${db.vendors.length}</strong></div><div class="metric"><span>Booking</span><strong>${db.bookings.length}</strong></div><div class="metric"><span>Kategori</span><strong>${db.categories.length}</strong></div></div><div class="panel"><h3>Aktivitas booking terbaru</h3>${db.bookings.length?db.bookings.slice().reverse().slice(0,6).map(b=>bookingRow(b)).join(''):'<div class="empty">Belum ada booking pada data demo.</div>'}</div><div class="panel"><h3>Data demo</h3><p class="small muted">Gunakan menu samping untuk mengelola vendor, pengguna, kategori, dan booking.</p><button class="btn danger tiny" onclick="resetDemo()">Reset seluruh data demo</button></div>`)}
function manageVendors(){if(!requireRole('admin'))return '';return shell(adminNav(),`<div class="row between"><h1 class="page-title">Manage Vendors</h1><button class="btn" onclick="adminVendorModal()">＋ Tambah Vendor</button></div><div class="panel table-wrap"><table><tr><th>Nama usaha</th><th>Kategori</th><th>Lokasi</th><th>Status</th><th>Aksi</th></tr>${db.vendors.map(v=>`<tr><td>${esc(v.namaUsaha)}</td><td>${esc(v.kategori)}</td><td>${esc(v.lokasi)}</td><td>${v.statusAktif?'Aktif':'Nonaktif'}</td><td><button class="btn tiny outline" onclick="toggleVendor('${v.id}')">${v.statusAktif?'Nonaktifkan':'Aktifkan'}</button> <button class="btn tiny danger" onclick="deleteVendor('${v.id}')">Hapus</button></td></tr>`).join('')}</table></div>`)}
function adminVendorModal(){showModal(`<h3>Tambah Vendor Demo</h3><form onsubmit="adminSaveVendor(event)"><div class="field"><label>Nama usaha</label><input name="name" required></div><div class="field"><label>Kategori</label><select name="cat">${CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Lokasi</label><input name="loc" required></div><div class="field"><label>Harga awal (Rp)</label><input name="price" type="number" min="0" required></div><div class="field"><label>Deskripsi</label><textarea name="desc"></textarea></div><button class="btn">Tambah Vendor</button></form>`)}
function adminSaveVendor(e){e.preventDefault();const f=new FormData(e.target),vid=id();db.vendors.push({id:vid,userId:null,namaUsaha:f.get('name'),kategori:f.get('cat'),lokasi:f.get('loc'),alamat:f.get('loc')+', Indonesia',deskripsi:f.get('desc'),imageUrl:'https://placehold.co/800x500/f3e7e2/642b3b?text=WEDSYNC+Vendor',portfolio:[],kontak:'6281234567890',ratingSimulasi:'4.8',statusVerifikasi:'Demo',statusAktif:true,packages:[{id:id(),namaPaket:'Paket Utama',deskripsi:'Layanan demo',harga:+f.get('price'),fasilitas:['Layanan sesuai paket'],durasiLayanan:'1 hari'}]});saveDB();closeModal();render()}
function toggleVendor(vid){const v=vendorFor(vid);v.statusAktif=!v.statusAktif;saveDB();render()}
function deleteVendor(vid){if(confirm('Hapus vendor demo ini?')){db.vendors=db.vendors.filter(v=>v.id!==vid);saveDB();render()}}
function manageUsers(){if(!requireRole('admin'))return '';return shell(adminNav(),`<div class="row between"><h1 class="page-title">Manage Users</h1><button class="btn" onclick="userModal()">＋ Tambah Pengguna</button></div><div class="panel table-wrap"><table><tr><th>Nama</th><th>Email</th><th>Role</th><th>Aksi</th></tr>${db.users.map(u=>`<tr><td>${esc(u.nama)}</td><td>${esc(u.email)}</td><td>${u.role}</td><td><button class="btn tiny danger" onclick="deleteUser('${u.id}')">Hapus</button></td></tr>`).join('')}</table></div>`)}
function userModal(){showModal(`<h3>Tambah Pengguna Demo</h3><form onsubmit="saveUser(event)"><div class="field"><label>Nama</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Role</label><select name="role"><option>customer</option><option>vendor</option><option>admin</option></select></div><button class="btn">Tambah</button></form>`)}
function saveUser(e){e.preventDefault();const f=new FormData(e.target);if(db.users.some(u=>u.email===f.get('email')))return toast('Email sudah digunakan');db.users.push({id:id(),nama:f.get('name'),email:f.get('email'),passwordDemo:'demo123',role:f.get('role'),tanggalDibuat:dateNow()});saveDB();closeModal();render()}
function deleteUser(uid){if(db.users.length<=1)return toast('Minimal satu pengguna harus tersedia');if(confirm('Hapus pengguna demo ini?')){db.users=db.users.filter(u=>u.id!==uid);saveDB();render()}}
function manageCategories(){if(!requireRole('admin'))return '';return shell(adminNav(),`<div class="row between"><h1 class="page-title">Manage Categories</h1><button class="btn" onclick="categoryModal()">＋ Tambah Kategori</button></div><div class="panel">${db.categories.map(c=>`<div class="row between" style="padding:10px;border-bottom:1px solid var(--line)"><span>${esc(c)}</span><button class="btn tiny danger" onclick="deleteCategory('${esc(c)}')">Hapus</button></div>`).join('')}</div>`)}
function categoryModal(){showModal(`<h3>Tambah Kategori</h3><form onsubmit="saveCategory(event)"><div class="field"><label>Nama kategori</label><input name="name" required></div><button class="btn">Tambah</button></form>`)}
function saveCategory(e){e.preventDefault();const n=new FormData(e.target).get('name').trim();if(db.categories.includes(n))return toast('Kategori sudah ada');db.categories.push(n);saveDB();closeModal();render()}
function deleteCategory(n){if(confirm('Hapus kategori ini?')){db.categories=db.categories.filter(c=>c!==n);saveDB();render()}}
function manageBookings(){if(!requireRole('admin'))return '';return shell(adminNav(),`<h1 class="page-title">Manage Bookings</h1><div class="panel table-wrap">${db.bookings.length?`<table><tr><th>Customer</th><th>Vendor</th><th>Tanggal</th><th>Total</th><th>Status</th><th>Aksi</th></tr>${db.bookings.map(b=>`<tr><td>${esc(db.users.find(u=>u.id===b.customerId)?.nama||'-')}</td><td>${esc(vendorFor(b.vendorId)?.namaUsaha||'-')}</td><td>${fmtDate(b.tanggalAcara)}</td><td>${money(b.totalHarga)}</td><td><span class="status ${statusClass(b.statusBooking)}">${b.statusBooking}</span></td><td><select onchange="adminBookingStatus('${b.id}',this.value)">${['Menunggu Konfirmasi','Diterima','Ditolak','Selesai'].map(s=>`<option ${b.statusBooking===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table>`:'<div class="empty">Belum ada booking.</div>'}</div>`)}
function adminBookingStatus(bid,s){const b=db.bookings.find(x=>x.id===bid);if(s==='Diterima'&&db.bookings.some(x=>x.id!==bid&&x.vendorId===b.vendorId&&x.tanggalAcara===b.tanggalAcara&&x.statusBooking==='Diterima'))return toast('Konflik tanggal: status tidak diubah');b.statusBooking=s;saveDB();render()}
function resetDemo(){if(confirm('Semua perubahan lokal akan dihapus dan data demo dikembalikan. Lanjutkan?')){db=makeSeed();saveDB();compareIds=[];toast('Data demo berhasil direset');render()}}
function render(){const app=document.getElementById('app');const pages={home,explore,detail,customer,planner,budget,bookings,favorites,collab,readiness,vendor,profile,services,requests,availability,customers,transactions,admin,manageVendors,manageUsers,manageCategories,manageBookings};app.innerHTML=(pages[page]||home)()}
render();
</script>
</body>
</html>
